material_inventory_totals.api_get_item:
  path: '/api/v1/inventory/item/{nid}'
  defaults:
    _controller: '\Drupal\material_inventory_totals\Controller\InventoryApiController::getItem'
    _format: json
  requirements:
    _permission: 'update material inventory counts'
    nid: \d+
  methods: [GET]
  options:
    _auth:
      - oauth2

material_inventory_totals.api_submit_count:
  path: '/api/v1/inventory/count'
  defaults:
    _controller: '\Drupal\material_inventory_totals\Controller\InventoryApiController::submitCount'
    _format: json
  requirements:
    _permission: 'update material inventory counts'
  methods: [POST]
  options:
    _auth:
      - oauth2

material_inventory_totals.api_restock:
  path: '/api/v1/inventory/restock'
  defaults:
    _controller: '\Drupal\material_inventory_totals\Controller\InventoryApiController::submitRestock'
    _format: json
  requirements:
    _permission: 'update material inventory counts'
  methods: [POST]
  options:
    _auth:
      - oauth2

material_inventory_totals.api_search:
  path: '/api/v1/inventory/search'
  defaults:
    _controller: '\Drupal\material_inventory_totals\Controller\InventoryApiController::search'
    _format: json
  requirements:
    _permission: 'update material inventory counts'
  methods: [GET]
  options:
    _auth:
      - oauth2

material_inventory_totals.inventory_count:
  path: '/admin/material/{node}/inventory-count'
  defaults:
    _form: '\Drupal\material_inventory_totals\Form\InventoryCountForm'
    _title: 'Update Inventory Count'
  requirements:
    _permission: 'update material inventory counts'
    _entity_access: 'node.update'
    _custom_access: '\Drupal\material_inventory_totals\Form\InventoryCountForm::access'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'

material_inventory_totals.inventory_check:
  path: '/admin/material/{node}/inventory-check'
  defaults:
    _form: '\Drupal\material_inventory_totals\Form\InventoryCheckForm'
    _title: 'Inventory check'
  requirements:
    _permission: 'update material inventory counts'
    _entity_access: 'node.update'
    _custom_access: '\Drupal\material_inventory_totals\Form\InventoryCheckForm::access'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'

material_inventory_totals.count_review:
  path: '/admin/material/count-review'
  defaults:
    _form: '\Drupal\material_inventory_totals\Form\CountReviewForm'
    _title: 'Inventory counts to review'
  requirements:
    _permission: 'edit any material_inventory entities'

material_inventory_totals.inventory:
  path: '/admin/material/inventory'
  defaults:
    _form: '\Drupal\material_inventory_totals\Form\InventorySessionForm'
    _title: 'Store inventory'
  requirements:
    _permission: 'update material inventory counts'

material_inventory_totals.inventory_flag:
  path: '/admin/material/inventory/flag/{flag}'
  defaults:
    _form: '\Drupal\material_inventory_totals\Form\InventoryFlagForm'
    _title: 'Recheck a count'
  requirements:
    _permission: 'update material inventory counts'
    flag: \d+
